# The unit lane, run on a machine that is not the author's.
#
# ARC-14.1 requires the boundaries between services to be "enforced by a tool
# (ESLint `no-restricted-imports`, `dependency-cruiser` or equivalent) run in
# CI, not by discipline alone". A tool run in CI is what this file is, and
# `dependency-cruiser` is now the tool: `npm run boundaries` is part of
# `npm run test:unit`, which is the whole of the lane below, so it arrived here
# without this file being edited, and will pick up rules 2…6 the same way.
#
# ARC-14.1 is still met only **in part**, for a reason that has nothing to do
# with the rules: the push trigger below names `master_disabled`, so nothing
# runs on `master` and only pull requests reach this lane. That was a deliberate
# change and it is left alone here; pointing the trigger back at `master` is
# what would finish the job.
#
# It invokes the very scripts a developer invokes, unchanged, so a green tick
# here means what a green run there means, and the two cannot drift apart.
#
# WHAT IS NOT RUN: the Playwright suite (`npm run test:integration`, the specs
# under `tests/`). It would need browsers provisioned on the runner, a separate
# decision with a separate cost, deliberately not taken here. A green tick below
# therefore says nothing at all about the integration tests; those still run on
# demand, locally. This exclusion is declared, not forgotten.

name: CI

on:
    push:
        branches: [master_disabled]
    pull_request:

permissions:
    contents: read

jobs:
    unit:
        name: unit lane — lint, typecheck, boundaries, headless tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  # The version the project already declares, read from the file
                  # that declares it. CI does not get to pick a second one.
                  node-version-file: .nvmrc
                  cache: npm

            # `ci`, not `install`: the lockfile decides what is installed, not a
            # resolution made at this moment on this machine.
            - run: npm ci

            # The unit lane, whole: `test:unit` is lint, typecheck, the boundary
            # check and the headless suite. Whatever that script grows to cover,
            # CI covers.
            - run: npm run test:unit
